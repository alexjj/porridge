    el.innerHTML = '<p class="empty">Search isn’t available yet. Its index is built when the site is published.</p>';
    return;
  }
  var ui = new PagefindUI({ element: "#search", showSubResults: true, showImages: false, autofocus: true, resetStyles: false });

  if (q) ui.triggerSearch(q);
})();
